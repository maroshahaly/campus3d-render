<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg2" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#12586b"/>
      <stop offset="55%" stop-color="#0a3b4c"/>
      <stop offset="100%" stop-color="#062733"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="55%" stop-color="#e8a800"/>
      <stop offset="100%" stop-color="#c9860a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg2)"/>

  <!-- emblem ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#gold2)" stroke-width="14"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold2)" stroke-width="3" stroke-opacity="0.55"/>

  <!-- waves inside the ring, lower third -->
  <g stroke="url(#gold2)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M 108 336 Q 182 312 256 336 T 404 336"/>
    <path d="M 96 368 Q 178 346 260 368 T 416 368"/>
  </g>

  <!-- hook + fish, same family mark as concept 1, scaled to sit in the emblem's upper field -->
  <g fill="none" stroke="url(#gold2)" stroke-width="22" stroke-linecap="round">
    <circle cx="222" cy="150" r="15"/>
    <path d="M 222 165
             L 225 288
             C 227 336 264 364 306 352
             C 340 342 353 302 328 278
             C 309 261 283 268 280 288"/>
    <path d="M 280 288 L 256 283" stroke-width="19"/>
  </g>
  <g transform="translate(196 288) rotate(-8)">
    <path d="M0 0 C 20 -17 51 -17 71 0 C 51 17 20 17 0 0 Z" fill="url(#gold2)"/>
    <path d="M71 0 L 95 -15 L 87 0 L 95 15 Z" fill="url(#gold2)"/>
    <circle cx="12" cy="-1" r="3.8" fill="#0a3b4c"/>
  </g>
</svg>
