<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b2a3d"/>
      <stop offset="35%" stop-color="#2c5b73"/>
      <stop offset="62%" stop-color="#e08a3e"/>
      <stop offset="78%" stop-color="#f7c169"/>
      <stop offset="100%" stop-color="#fbe0a0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffce6b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffce6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6da"/>
      <stop offset="100%" stop-color="#ffdb84"/>
    </linearGradient>
    <linearGradient id="seaFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9773a"/>
      <stop offset="100%" stop-color="#8a5a6e"/>
    </linearGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c4f6e"/>
      <stop offset="100%" stop-color="#3c4f68"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#284a5e"/>
      <stop offset="100%" stop-color="#173a4c"/>
    </linearGradient>
    <linearGradient id="sea3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123241"/>
      <stop offset="100%" stop-color="#0a2029"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2a2f"/>
      <stop offset="100%" stop-color="#060d10"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#0e2430"/>
      <stop offset="55%" stop-color="#1a3d4d"/>
      <stop offset="100%" stop-color="#e8a800"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="38%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1080" height="1920" fill="url(#sky)"/>

  <!-- sun + glow, low on the horizon -->
  <circle cx="705" cy="1120" r="360" fill="url(#sunGlow)"/>
  <circle cx="705" cy="1120" r="120" fill="url(#sun)"/>

  <!-- birds -->
  <g stroke="#1c2a33" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M180 300 q18 -20 36 0 q18 -20 36 0"/>
    <path d="M260 360 q14 -16 28 0 q14 -16 28 0"/>
    <path d="M120 420 q12 -14 24 0 q12 -14 24 0"/>
  </g>

  <!-- distant boat silhouette on the horizon -->
  <g transform="translate(160,1128)" opacity="0.85">
    <path d="M-70 18 L70 18 L48 34 L-48 34 Z" fill="#3a2f3f"/>
    <path d="M0 18 L0 -46 L34 18 Z" fill="#3a2f3f"/>
  </g>

  <!-- ============ SEA (far to near) ============ -->
  <path d="M0 1150 Q 270 1110 540 1150 T 1080 1150 L1080 1230 Q 810 1195 540 1225 T 0 1225 Z" fill="url(#seaFar)"/>
  <path d="M0 1230 Q 270 1180 540 1225 T 1080 1220 L1080 1340 Q 810 1300 540 1335 T 0 1330 Z" fill="url(#sea1)"/>
  <path d="M0 1330 Q 300 1270 540 1320 T 1080 1315 L1080 1520 Q 780 1460 540 1500 T 0 1490 Z" fill="url(#sea2)"/>
  <path d="M0 1490 Q 320 1420 600 1480 T 1080 1470 L1080 1920 L0 1920 Z" fill="url(#sea3)"/>

  <!-- foam highlights on the wave crests -->
  <g stroke="#eaf6f2" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M40 1233 Q 300 1188 550 1228 T 1040 1222" stroke-width="5"/>
    <path d="M20 1335 Q 310 1275 545 1323 T 1050 1318" stroke-width="6"/>
    <path d="M10 1495 Q 330 1425 605 1483 T 1060 1474" stroke-width="8"/>
  </g>

  <!-- splash burst beneath the leaping marlin -->
  <g fill="#eef8f6" opacity="0.85">
    <ellipse cx="790" cy="1345" rx="150" ry="34"/>
    <circle cx="700" cy="1310" r="12"/>
    <circle cx="880" cy="1300" r="9"/>
    <circle cx="920" cy="1330" r="14"/>
    <circle cx="660" cy="1335" r="8"/>
  </g>

  <!-- ============ MARLIN, leaping (nose points up-right, into the jump) ============ -->
  <g transform="translate(760,1260) rotate(-34) scale(1.05)">
    <!-- tail, crescent, drawn first so the body overlaps it -->
    <path d="M-140 -6 C -178 -38 -202 -70 -212 -102 C -190 -62 -163 -36 -142 -15 Z" fill="url(#fishBody)"/>
    <path d="M-140 6 C -178 40 -202 72 -212 104 C -190 64 -163 37 -142 15 Z" fill="url(#fishBody)"/>
    <!-- dorsal sail fin -->
    <path d="M-38 -28 C -22 -96 8 -150 52 -176 C 34 -118 18 -66 22 -22 Z" fill="url(#fishBody)"/>
    <!-- pectoral fin -->
    <path d="M-6 22 C -20 56 -28 82 -25 98 C -10 72 4 48 14 28 Z" fill="url(#fishBody)" opacity="0.92"/>
    <!-- body -->
    <path d="M-140 0 C -104 -34 -30 -46 46 -30 C 84 -22 108 -10 124 0
             C 108 10 84 21 46 28 C -30 44 -104 33 -140 0 Z" fill="url(#fishBody)"/>
    <!-- bill -->
    <path d="M120 -7 L182 0 L120 7 Z" fill="url(#fishBody)"/>
    <circle cx="92" cy="-9" r="5.5" fill="#eaf3ef"/>
  </g>

  <!-- ============ FOREGROUND ROCK + FISHERMAN ============ -->
  <path d="M-10 1920 L-10 1660 C 40 1600 90 1650 130 1600 C 165 1558 210 1610 260 1572
           C 310 1534 350 1600 410 1575 C 470 1550 520 1615 590 1600
           C 680 1580 760 1660 860 1650 C 950 1642 1010 1700 1090 1690
           L1090 1920 Z" fill="url(#rock)"/>
  <!-- rim light catching the rock edge from the sunset -->
  <path d="M-10 1660 C 40 1600 90 1650 130 1600 C 165 1558 210 1610 260 1572
           C 310 1534 350 1600 410 1575 C 470 1550 520 1615 590 1600
           C 680 1580 760 1660 860 1650 C 950 1642 1010 1700 1090 1690"
        fill="none" stroke="#f2b45f" stroke-width="4" opacity="0.35"/>

  <!-- fishing line from rod tip to the hook near the splash -->
  <path d="M260 1420 C 420 1370 560 1330 690 1305" fill="none" stroke="#dfe6e2" stroke-width="3" opacity="0.8"/>
  <!-- hook at the line's end -->
  <g transform="translate(690,1305) rotate(20)">
    <path d="M0 0 C 10 14 8 26 -4 28 C -14 30 -20 20 -14 12" fill="none" stroke="#f3c94a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- fisherman silhouette standing on the rock -->
  <g transform="translate(150,1430)" fill="#0a1417">
    <!-- legs -->
    <path d="M-18 170 L-30 260 L-14 262 L2 176 Z"/>
    <path d="M10 170 L18 258 L34 256 L22 172 Z"/>
    <!-- torso (coat) -->
    <path d="M-26 60 C -34 100 -30 150 -18 176 L 26 176 C 34 148 32 96 22 58 C 8 44 -12 44 -26 60 Z"/>
    <!-- arm holding rod raised -->
    <path d="M18 66 C 60 44 110 28 168 8 L 176 22 C 122 44 78 64 34 88 Z"/>
    <!-- other arm relaxed -->
    <path d="M-24 74 C -38 96 -44 118 -40 140 L -26 138 C -28 118 -22 98 -12 82 Z"/>
    <!-- head + hat -->
    <circle cx="0" cy="28" r="22"/>
    <path d="M-26 20 C -26 2 -10 -10 8 -8 C 26 -6 36 6 34 20 C 18 12 -8 12 -26 20 Z"/>
  </g>
  <!-- fishing rod -->
  <path d="M168 1444 L306 1382" stroke="#3a2a1a" stroke-width="6" stroke-linecap="round"/>

  <!-- cinematic vignette -->
  <rect x="0" y="0" width="1080" height="1920" fill="url(#vig)"/>
</svg>
